name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Check frame-evidence interpretation
        run: python3 -m unittest discover -s verification -p test_frame_metrics.py
      - name: Check Kotlin formatting
        run: python3 verification/format_kotlin.py --check
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Unit tests, lint and optimized bundle
        run: ./gradlew :domain:test :data:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease
      - name: Sign optimized APK with an ephemeral QA key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/shelf-qa.jks" -storepass android -keypass android -alias shelf-qa -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Shelf QA" -noprompt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/shelf-qa.jks" --ks-pass pass:android --out app/build/outputs/apk/release/shelf-release-qa.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Build separate optimized-runtime probe
        env:
          SHELF_QA_STORE_PASSWORD: android
        run: |
          python3 verification/build_runtime_probe.py --sdk "$ANDROID_HOME" --keystore "$RUNNER_TEMP/shelf-qa.jks" --output "$RUNNER_TEMP/shelf-probe"
          cp "$RUNNER_TEMP/shelf-probe/shelf-runtime-probe.apk" app/build/outputs/apk/release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-runtime-apk
          retention-days: 7
          path: app/build/outputs/apk/release/shelf-*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-and-lint-reports
          retention-days: 7
          path: |
            domain/build/reports/tests/
            data/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/debug/app-debug.apk
  device:
    name: device-api-${{ matrix.api }}
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '12266719'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile test APKs before starting the emulator
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-runtime-apk
          path: qa-apk
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest
            adb pull /sdcard/Download/shelf-test-output native-screenshots
            python3 verification/android_runtime.py --serial "$(adb get-serialno)" --apk qa-apk/shelf-release-qa.apk --output release-runtime/result.json
            python3 verification/run_runtime_probe.py --serial "$(adb get-serialno)" --app-apk qa-apk/shelf-release-qa.apk --probe-apk qa-apk/shelf-runtime-probe.apk --output signed-runtime-probe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: device-test-reports-api-${{ matrix.api }}
          retention-days: 7
          path: |
            app/build/reports/androidTests/
            native-screenshots/
            release-runtime/
            signed-runtime-probe/
